<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#171717" />
  <title>모바일 커피 주문</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #171717; background: #f5f4ef; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 20px 16px calc(112px + env(safe-area-inset-bottom)); }
    main { max-width: 560px; margin: 0 auto; }
    h1 { margin: 4px 0 6px; font-size: 1.75rem; }
    .sub { margin: 0 0 22px; color: #666; line-height: 1.5; }
    .panel { background: white; border-radius: 18px; padding: 16px; box-shadow: 0 5px 18px rgba(0,0,0,.06); margin-bottom: 16px; }
    label.title { display: block; font-weight: 750; margin-bottom: 9px; }
    input[type=text] { width: 100%; min-height: 52px; border: 1px solid #d8d8d8; border-radius: 14px; padding: 0 14px; font-size: 16px; outline: none; }
    input[type=text]:focus { border-color: #222; }
    #menuList { display: grid; gap: 10px; }
    .menu { display: flex; align-items: center; min-height: 66px; padding: 12px 14px; border: 2px solid transparent; background: white; border-radius: 16px; cursor: pointer; }
    .menu:has(input:checked) { border-color: #171717; background: #fffdf4; }
    .menu input { width: 22px; height: 22px; margin: 0 12px 0 0; }
    .code { display: inline-block; min-width: 46px; font-weight: 800; }
    .name { font-weight: 650; }
    .verify { width: 100%; min-height: 54px; border: 0; border-radius: 14px; background: #2c2c2c; color: white; font-size: 16px; font-weight: 750; }
    .verify:disabled { opacity: .55; }
    .status { margin: 10px 0 0; font-size: .95rem; color: #5b5b5b; line-height: 1.45; }
    .status.ok { color: #087a39; }
    .status.err { color: #b3261e; }
    .bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(245,244,239,.94); backdrop-filter: blur(10px); border-top: 1px solid rgba(0,0,0,.08); }
    .bottom button { display: block; width: min(528px, 100%); margin: 0 auto; min-height: 58px; border: 0; border-radius: 16px; background: #171717; color: white; font-size: 17px; font-weight: 800; }
    .bottom button:disabled { background: #aaa; }
    #result { display: none; }
    #result.show { display: block; }
    .result-grid { display: grid; grid-template-columns: 92px 1fr; gap: 8px; line-height: 1.5; }
    .result-grid b { color: #555; }
  </style>
</head>
<body>
<main>
  <h1>☕ 커피 주문</h1>
  <p class="sub">실제 스마트폰 기기 인증 후 주문할 수 있습니다.</p>

  <section class="panel">
    <label class="title" for="name">이름</label>
    <input id="name" type="text" maxlength="20" autocomplete="name" placeholder="이름을 입력하세요" />
  </section>

  <section class="panel">
    <span class="title">메뉴 선택</span>
    <div id="menuList">메뉴 불러오는 중...</div>
  </section>

  <section class="panel">
    <button id="verifyBtn" class="verify" type="button">📱 이 기기 인증하기</button>
    <p id="deviceStatus" class="status">주문 전에 실제 스마트폰 센서를 확인합니다.</p>
  </section>

  <section id="result" class="panel" aria-live="polite">
    <h2 style="margin-top:0">주문 결과</h2>
    <div class="result-grid">
      <b>이름</b><span id="rName"></span>
      <b>메뉴 코드</b><span id="rCode"></span>
      <b>메뉴명</b><span id="rMenu"></span>
      <b>상태</b><span id="rStatus"></span>
    </div>
  </section>
</main>

<div class="bottom">
  <button id="orderBtn" type="button" disabled>기기 인증 후 주문할 수 있어요</button>
</div>

<script>
  const menuList = document.getElementById('menuList');
  const verifyBtn = document.getElementById('verifyBtn');
  const orderBtn = document.getElementById('orderBtn');
  const deviceStatus = document.getElementById('deviceStatus');
  let deviceToken = null;

  async function jsonFetch(url, options = {}) {
    const response = await fetch(url, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
    });
    const data = await response.json().catch(() => ({ detail: '서버 응답을 읽을 수 없습니다.' }));
    if (!response.ok) throw new Error(data.detail || '요청에 실패했습니다.');
    return data;
  }

  async function loadMenus() {
    try {
      const menus = await jsonFetch('/api/menus');
      menuList.innerHTML = menus.map((m) => `
        <label class="menu">
          <input type="radio" name="menu" value="${m.code}">
          <span><span class="code">${m.code}</span><span class="name">${m.name}</span></span>
        </label>`).join('');
    } catch (err) {
      menuList.textContent = err.message;
    }
  }

  function setDeviceMessage(message, kind = '') {
    deviceStatus.textContent = message;
    deviceStatus.className = `status ${kind}`;
  }

  function waitForSensorSample(timeoutMs = 6500) {
    return new Promise((resolve, reject) => {
      let motion = null;
      let orientation = null;
      let done = false;

      const hasNumber = v => typeof v === 'number' && Number.isFinite(v);
      const finishIfReady = () => {
        const motionOk = motion && [motion.x, motion.y, motion.z].some(hasNumber);
        const orientationOk = orientation && [orientation.alpha, orientation.beta, orientation.gamma].some(hasNumber);
        if (!done && (motionOk || orientationOk)) {
          done = true;
          cleanup();
          resolve({ motion, orientation });
        }
      };

      const onMotion = e => {
        const a = e.accelerationIncludingGravity || e.acceleration || {};
        motion = { x: a.x, y: a.y, z: a.z };
        finishIfReady();
      };
      const onOrientation = e => {
        orientation = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
        finishIfReady();
      };
      const cleanup = () => {
        window.removeEventListener('devicemotion', onMotion);
        window.removeEventListener('deviceorientation', onOrientation);
        clearTimeout(timer);
      };

      window.addEventListener('devicemotion', onMotion, { passive: true });
      window.addEventListener('deviceorientation', onOrientation, { passive: true });
      const timer = setTimeout(() => {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error('센서 값을 받지 못했습니다. 휴대폰을 살짝 움직인 뒤 다시 시도하세요. iPhone은 HTTPS 접속이 필요할 수 있습니다.'));
      }, timeoutMs);
    });
  }

  async function requestIOSPermissionIfNeeded() {
    const requests = [];
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      requests.push(DeviceMotionEvent.requestPermission());
    }
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      requests.push(DeviceOrientationEvent.requestPermission());
    }
    if (!requests.length) return;
    const states = await Promise.all(requests);
    if (states.some(s => s !== 'granted')) throw new Error('센서 권한이 허용되지 않았습니다.');
  }

  verifyBtn.addEventListener('click', async () => {
    verifyBtn.disabled = true;
    orderBtn.disabled = true;
    deviceToken = null;
    setDeviceMessage('기기 확인 중... 휴대폰을 살짝 움직여 주세요.');

    try {
      const coarse = matchMedia('(pointer: coarse)').matches;
      const maxTouchPoints = navigator.maxTouchPoints || 0;
      if (!coarse || maxTouchPoints <= 0) throw new Error('터치 기반 스마트폰으로 확인되지 않았습니다.');

      await requestIOSPermissionIfNeeded();
      const challenge = await jsonFetch('/api/device/challenge', { method: 'POST', body: '{}' });
      const sensors = await waitForSensorSample();
      const verified = await jsonFetch('/api/device/verify', {
        method: 'POST',
        body: JSON.stringify({
          challenge_id: challenge.challenge_id,
          max_touch_points: maxTouchPoints,
          coarse_pointer: coarse,
          motion: sensors.motion,
          orientation: sensors.orientation
        })
      });

      deviceToken = verified.device_token;
      setDeviceMessage('✓ 실제 모바일 기기 인증 완료 (5분간 유효)', 'ok');
      orderBtn.disabled = false;
      orderBtn.textContent = '주문하기';
    } catch (err) {
      setDeviceMessage(err.message, 'err');
      orderBtn.textContent = '기기 인증 후 주문할 수 있어요';
    } finally {
      verifyBtn.disabled = false;
    }
  });

  function makeUuidV4() {
    if (crypto.randomUUID) return crypto.randomUUID();
    const bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    const hex = [...bytes].map(b => b.toString(16).padStart(2, '0'));
    return `${hex.slice(0,4).join('')}-${hex.slice(4,6).join('')}-${hex.slice(6,8).join('')}-${hex.slice(8,10).join('')}-${hex.slice(10,16).join('')}`;
  }

  orderBtn.addEventListener('click', async () => {
    const name = document.getElementById('name').value;
    const selected = document.querySelector('input[name=menu]:checked');

    if (!deviceToken) return alert('먼저 이 기기를 인증해 주세요.');
    if (!name.trim()) return alert('이름을 입력해 주세요.');
    if (!selected) return alert('메뉴를 선택해 주세요.');

    const orderId = makeUuidV4();
    orderBtn.disabled = true;
    orderBtn.textContent = '주문 전송 중...';

    try {
      const result = await jsonFetch('/api/order', {
        method: 'POST',
        body: JSON.stringify({ order_id: orderId, name, menu_code: selected.value, device_token: deviceToken })
      });

      document.getElementById('rName').textContent = result.name;
      document.getElementById('rCode').textContent = result.menu_code;
      document.getElementById('rMenu').textContent = result.menu_name;
      document.getElementById('rStatus').textContent = '✅ ' + result.status;
      document.getElementById('result').classList.add('show');
      orderBtn.textContent = '주문 완료';
    } catch (err) {
      alert(err.message);
      orderBtn.disabled = false;
      orderBtn.textContent = '다시 주문하기';
    }
  });

  loadMenus();
</script>
</body>
</html>
